services:
  postgres:
    image: postgres:16-alpine
    container_name: bookmark-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookmark
      POSTGRES_PASSWORD: bookmark
      POSTGRES_DB: bookmarks
    ports:
      - "5432:5432"
    volumes:
      - bookmark-manager-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmark -d bookmarks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bookmark-manager-postgres:
